<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Facturas</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Facturas">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--sec:#6e6e73;--sep:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--bar:rgba(242,242,247,.82)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--sec:#98989f;--sep:rgba(84,84,88,.65);--fill:rgba(118,118,128,.24);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--bar:rgba(0,0,0,.78)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
#app{max-width:680px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.view{display:none}.view.active{display:block;animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{margin:20px 0 0;color:var(--sec);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
h1{font-size:34px;font-weight:700;margin:2px 0 22px}
h2{font-size:22px;font-weight:700;margin:16px 0 6px}
.muted{color:var(--sec);font-size:15px;margin:0 0 18px}
.tile{display:flex;align-items:center;gap:16px;width:100%;padding:18px;margin:0 0 14px;border:0;border-radius:22px;background:var(--card);text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);transition:transform .2s}
.tile:active{transform:scale(.97)}
.ic{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;color:#fff}
.tx{flex:1}.tx b{display:block;font-size:19px;font-weight:600}.tx small{color:var(--sec);font-size:14px}
.chev{color:var(--sec);font-size:28px;opacity:.5}
.bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(50px + env(safe-area-inset-top));margin:calc(-12px - env(safe-area-inset-top)) -16px 12px;padding:env(safe-area-inset-top) 6px 0;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.bar b{font-weight:600}
.link{justify-self:start;background:none;border:0;color:var(--blue);padding:8px 10px;cursor:pointer;font-size:17px}
.link.r{justify-self:end}.link.strong{font-weight:600}
.card{background:var(--card);border-radius:22px;padding:28px 20px}
.center{text-align:center}
.hero{width:84px;height:84px;margin:0 auto;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0a84ff,#5e5ce6)}
.btn{display:block;width:100%;padding:15px;margin-top:10px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;text-align:center;cursor:pointer;transition:opacity .2s}
.btn:active{opacity:.7}.btn:disabled{opacity:.4}
.btn.sec{background:var(--fill);color:var(--blue)}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.prev{max-width:100%;max-height:45vh;border-radius:14px;margin-bottom:16px}
.spin{width:30px;height:30px;margin:10px auto;border:3px solid var(--fill);border-top-color:var(--blue);border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.seg{display:flex;padding:2px;margin-bottom:14px;background:var(--fill);border-radius:9px}
.seg button{flex:1;padding:6px 4px;border:0;border-radius:7px;background:none;font-size:13px;font-weight:500;cursor:pointer}
.seg .on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st{background:var(--card);border-radius:14px;padding:12px 14px}
.st small{display:block;color:var(--sec);font-size:12px;font-weight:600;text-transform:uppercase}
.st b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;margin-bottom:6px}
.search{flex:1;display:flex;align-items:center;gap:6px;padding:0 10px;height:38px;background:var(--fill);border-radius:10px;color:var(--sec)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--tx)}
.fbtn{position:relative;width:38px;height:38px;border:0;border-radius:10px;background:var(--fill);color:var(--blue);display:grid;place-items:center;cursor:pointer}
#fcount:not(:empty){position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:18px}
.gh{display:flex;justify-content:space-between;margin:18px 16px 6px;color:var(--sec);font-size:13px;text-transform:uppercase}
.group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:12px}
#filt{margin-top:10px}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 16px}
.row+.row:before,.item+.item:before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.item+.item:before{left:66px}
.row>span{flex:none;font-size:16px}
.row input,.row select{flex:1;min-width:0;border:0;background:none;text-align:right;outline:0;color:var(--sec);font-size:16px;-webkit-appearance:none;appearance:none}
.row select{text-align-last:right;cursor:pointer}
.row input:focus,.row select:focus{color:var(--tx)}
button.row{width:100%;border:0;background:none;color:var(--red);justify-content:center;cursor:pointer}
.item{position:relative;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;cursor:pointer}
.item:active{background:var(--fill)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600}
.mid{flex:1;min-width:0}
.mid .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .s{color:var(--sec);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.end{text-align:right}
.amt{font-weight:600;font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.p-Pendiente{background:rgba(255,149,0,.15);color:var(--orange)}
.p-Revisado{background:rgba(52,199,89,.15);color:var(--green)}
.p-Observado{background:rgba(255,59,48,.15);color:var(--red)}
.p-sync{background:var(--fill);color:var(--sec)}
.p-err{background:rgba(255,59,48,.15);color:var(--red)}
.lupa{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:var(--fill);color:var(--blue);display:grid;place-items:center;cursor:pointer}
.empty{padding:50px 0;text-align:center;color:var(--sec)}
.foot{display:block;text-align:center;margin-top:20px;color:var(--blue);text-decoration:none;font-size:15px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:680px;max-height:calc(100dvh - env(safe-area-inset-top) - 16px);margin:0 auto;padding:0 16px 30px;overflow-y:auto;background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .4s cubic-bezier(.32,.72,0,1)}
.sheet.open{transform:none}
.sheet .bar{height:50px;margin:0 -16px 12px;padding:0 6px}
.sheet{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.grab{width:36px;height:5px;margin:6px auto 0;border-radius:3px;background:var(--sep)}
.imgbox{position:relative;display:grid;place-items:center;height:200px;margin-bottom:8px;border-radius:14px;overflow:hidden;background:var(--card);cursor:zoom-in;transition:height .3s}
.imgbox.zoom{height:70vh;cursor:zoom-out}
.imgbox img{max-width:100%;max-height:100%;object-fit:contain}
.imgbox img:not([src]){display:none}
.imgbox .spin{position:absolute}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));z-index:40;transform:translate(-50%,20px);max-width:90vw;padding:12px 18px;border-radius:14px;background:rgba(30,30,30,.92);color:#fff;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:.3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ok,.warn{border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14px;line-height:1.4}
.ok{background:rgba(52,199,89,.14);color:#248a3d;font-weight:600}
.warn{background:rgba(255,149,0,.14)}
.warn b{display:block;color:#c46a00;margin-bottom:4px}
.row.bad>span{color:#c46a00;font-weight:600}
@media (prefers-color-scheme:dark){.ok{color:#30d158}.warn b,.row.bad>span{color:#ff9f0a}}
</style>
</head>
<body>
<div id="app">

  <!-- INICIO -->
  <section id="v-home" class="view active">
    <p class="eyebrow" id="hoy"></p>
    <h1>Mis Facturas</h1>
    <button class="tile" id="draftTile" hidden onclick="seguirBorrador()">
      <span class="ic" style="background:linear-gradient(135deg,#ff9f0a,#ff6b00)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
      <span class="tx"><b>Factura sin terminar</b><small>Toca para continuar donde te quedaste</small></span>
      <span class="chev">›</span>
    </button>
    <button class="tile" onclick="go('cargar')">
      <span class="ic" style="background:linear-gradient(135deg,#0a84ff,#5e5ce6)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
      <span class="tx"><b>Cargar factura</b><small>Toma una foto y extrae los datos</small></span>
      <span class="chev">›</span>
    </button>
    <button class="tile" onclick="go('conta')">
      <span class="ic" style="background:linear-gradient(135deg,#30d158,#00a86b)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg></span>
      <span class="tx"><b>Contabilidad</b><small>Resumen, filtros y detalle</small></span>
      <span class="chev">›</span>
    </button>
  </section>

  <!-- CARGAR -->
  <section id="v-cargar" class="view">
    <nav class="bar"><button class="link" onclick="go('home')">‹ Inicio</button><b>Cargar factura</b><span></span></nav>
    <div id="pick" class="card center">
      <div class="hero"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></div>
      <h2>Fotografía tu comprobante</h2>
      <p class="muted">Buena luz, sin sombras, documento completo y el código QR visible.</p>
      <label class="btn" for="cam">Tomar foto</label>
      <label class="btn sec" for="gal">Elegir de galería</label>
      <input class="vh" type="file" id="cam" accept="image/*" capture="environment" onchange="onFile(this)">
      <input class="vh" type="file" id="gal" accept="image/*" onchange="onFile(this)">
    </div>
    <div id="proc" class="card center" hidden>
      <img id="procImg" class="prev" alt="">
      <div id="procWait"><div class="spin"></div><p class="muted">Leyendo factura…</p></div>
      <div id="procErr" hidden>
        <p class="muted" id="procMsg"></p>
        <button class="btn" onclick="procesar()">Reintentar</button>
        <button class="btn sec" onclick="cancelarFoto()">Cancelar</button>
      </div>
    </div>
  </section>

  <!-- CONTABILIDAD -->
  <section id="v-conta" class="view">
    <nav class="bar"><button class="link" onclick="go('home')">‹ Inicio</button><b>Contabilidad</b><button class="link r" onclick="load(true)">Actualizar</button></nav>
    <div class="seg" id="per">
      <button data-p="all" class="on">Todo</button><button data-p="mes">Este mes</button><button data-p="ant">Mes ant.</button><button data-p="anio">Año</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Proveedor, RUC, número…"></div>
      <button class="fbtn" onclick="$('#filt').hidden=!$('#filt').hidden" aria-label="Filtros"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M7 12h10M10 18h4"/></svg><span id="fcount"></span></button>
    </div>
    <div class="group" id="filt" hidden>
      <label class="row"><span>Desde</span><input type="date" data-f="desde"></label>
      <label class="row"><span>Hasta</span><input type="date" data-f="hasta"></label>
      <label class="row"><span>Categoría</span><select data-f="categoria" data-o="categorias"></select></label>
      <label class="row"><span>Tipo</span><select data-f="tipo" data-o="tipos"></select></label>
      <label class="row"><span>Moneda</span><select data-f="moneda" data-o="monedas"></select></label>
      <label class="row"><span>Estado</span><select data-f="estado" data-o="estados"></select></label>
      <button class="row" onclick="clearF()">Limpiar filtros</button>
    </div>
    <div id="list"></div>
    <a id="sheetLink" class="foot" target="_blank" hidden>Abrir hoja de cálculo ↗</a>
  </section>
</div>

<!-- HOJA: revisar / detalle -->
<div class="overlay" id="ov" onclick="S.isNew||closeSheet()"></div>
<div class="sheet" id="sh">
  <div class="grab"></div>
  <nav class="bar"><button class="link" id="shCancel" onclick="cancelSheet()">Cerrar</button><b id="shTitle">Detalle</b><button class="link r strong" onclick="save()">Guardar</button></nav>
  <div class="imgbox" onclick="this.classList.toggle('zoom')"><img id="shImg" alt="Factura"><div class="spin" id="imgSpin" hidden></div></div>
  <div id="chk"></div>
  <form id="frm" onsubmit="return false" oninput="onEdit(event)" onchange="validar()"></form>
  <button class="btn" id="saveBtn" onclick="save()">Guardar</button>
</div>
<div id="toast"></div>

<script>
const S = { cfg: null, data: [], loaded: false, fresh: 0, cur: null, isNew: false, busy: false, q: '',
  f: { desde: '', hasta: '', categoria: '', tipo: '', moneda: '', estado: '' } };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const r2 = x => Math.round(x * 100) / 100;
const money = (n, m) => new Intl.NumberFormat('es-PE', { style: 'currency', currency: m === 'USD' ? 'USD' : 'PEN' }).format(+n || 0);
const iso = d => d.toLocaleDateString('en-CA');
const fdate = d => /^\d{4}-\d{2}-\d{2}$/.test(d) ? new Date(d + 'T12:00').toLocaleDateString('es-PE', { day: '2-digit', month: 'short' }) : 'Sin fecha';
const nz = s => String(s || '').trim().toUpperCase().replace(/^0+/, '');
const limpio = r => Object.fromEntries(Object.entries(r).filter(([k]) => k[0] !== '_'));
const PAL = ['#ff9500','#007aff','#34c759','#af52de','#ff2d55','#5ac8fa','#ffcc00','#5856d6','#ff3b30','#30b0c7','#a2845e','#64d2ff','#8e8e93'];
const LUPA = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
const ATTR = { date: 'type="date"', text: 'type="text"',
  ser: 'type="text" autocapitalize="characters" autocomplete="off"',
  dig: 'type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"',
  num: 'type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"' };
const numv = x => parseFloat(String(x ?? '').replace(/\s/g, '').replace(',', '.')) || 0;
const cache = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const GROUPS = [
  ['Comprobante', [['fechaEmision','Fecha emisión','date'], ['tipo','Tipo','tipos'], ['serie','Serie','ser'], ['numero','Número','dig']]],
  ['Emisor', [['ruc','RUC','dig'], ['proveedor','Proveedor','text'], ['categoria','Categoría','categorias']]],
  ['Importes', [['moneda','Moneda','monedas'], ['total','Total','num'], ['subtotal','Subtotal','num'], ['igv','IGV','num']]],
  ['Control', [['descripcion','Descripción','text'], ['estado','Estado','estados']]]
];

/* ---- API: tiempo límite y reintentos automáticos ---- */
const API_URL = (window.CONFIG && CONFIG.API_URL || '').trim();
class NetErr extends Error {}
async function api(action, args = [], { timeout = 25000, tries = 3 } = {}) {
  if (!API_URL) throw new Error('Falta API_URL en config.js');
  for (let i = 1; ; i++) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeout);
    try {
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, args }), signal: ctl.signal });
      const j = await res.json();
      if (j.ok) return j.data;
      if (!j.retry) { const e = new Error(j.error || 'Error del servidor'); e.user = true; throw e; }
      throw new NetErr(j.error);
    } catch (e) {
      if (e.user) throw e;
      if (i >= tries) throw new NetErr(navigator.onLine === false ? 'Sin conexión a internet' : 'El servidor no respondió');
      await sleep(700 * i * i);
    } finally { clearTimeout(t); }
  }
}

/* ---- Navegación ---- */
function go(v) {
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('active', e.id === 'v-' + v));
  window.scrollTo(0, 0);
  if (v === 'home') verBorrador();
  if (v === 'cargar') resetCap();
  if (v === 'conta') load();
}
function toast(m, ms = 3000) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms); }
const opts = arr => '<option value="">—</option>' + (arr || []).map(o => `<option>${esc(o)}</option>`).join('');

/* ---- Imagen: alta resolución + recortes ampliados ---- */
const loadImg = file => new Promise((res, rej) => {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { URL.revokeObjectURL(url); res(img); };
  img.onerror = rej; img.src = url;
});
function toCanvas(src, sx, sy, sw, sh, max) {
  const s = Math.min(1, max / Math.max(sw, sh)), c = document.createElement('canvas');
  c.width = Math.round(sw * s); c.height = Math.round(sh * s);
  c.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
const b64 = c => c.toDataURL('image/jpeg', .9).split(',')[1];
function recortes(c, tile = 900, ov = 70) {
  const W = c.width, H = c.height, out = [];
  if (Math.max(W, H) <= 1400) return out;
  const cols = Math.ceil(W / tile), rows = Math.ceil(H / tile), tw = W / cols, th = H / rows;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
    const x = Math.max(0, k * tw - ov), y = Math.max(0, r * th - ov);
    out.push(b64(toCanvas(c, x, y, Math.min(W - x, tw + 2 * ov), Math.min(H - y, th + 2 * ov), 1200)));
  }
  return out;
}
const IMG = new Map();
function cacheImg(id, s) { IMG.set(id, s); if (IMG.size > 15) IMG.delete(IMG.keys().next().value); }

/* ---- QR SUNAT: RUC|tipo|serie|número|IGV|total|fecha|... (datos exactos) ---- */
const TIPO_QR = { '01': 'Factura', '03': 'Boleta', '07': 'Nota de crédito', '12': 'Ticket' };
function parseQR(t) {
  const p = String(t).split('|').map(x => x.trim());
  if (p.length < 7 || !/^\d{11}$/.test(p[0]) || !/^\d{2}$/.test(p[1])) return null;
  const num = v => { v = String(v || ''); const x = parseFloat(v.includes('.') ? v.replace(/,/g, '') : v.replace(',', '.')); return isNaN(x) ? undefined : x; };
  let f = p[6]; const m = f.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})$/); if (m) f = `${m[3]}-${m[2]}-${m[1]}`;
  const o = { ruc: p[0], tipo: TIPO_QR[p[1]], serie: p[2].toUpperCase(), numero: p[3], igv: num(p[4]), total: num(p[5]),
    fechaEmision: /^\d{4}-\d{2}-\d{2}$/.test(f) ? f : undefined };
  Object.keys(o).forEach(k => (o[k] === undefined || o[k] === '') && delete o[k]);
  return o;
}
function leerQR(c) {
  if (!window.jsQR) return null;
  for (const max of [1400, 2400]) {
    const k = max >= Math.max(c.width, c.height) ? c : toCanvas(c, 0, 0, c.width, c.height, max);
    const q = jsQR(k.getContext('2d').getImageData(0, 0, k.width, k.height).data, k.width, k.height, { inversionAttempts: 'attemptBoth' });
    const p = q && parseQR(q.data);
    if (p) return p;
    if (k === c) break;
  }
  return null;
}

/* ---- Cargar factura (la foto se conserva para reintentar si falla la conexión) ---- */
let foto = null;
function procState(s, msg) {
  $('#pick').hidden = s !== 'pick'; $('#proc').hidden = s === 'pick';
  $('#procWait').hidden = s !== 'wait'; $('#procErr').hidden = s !== 'err';
  if (msg) $('#procMsg').textContent = msg;
}
function resetCap() { if (!S.busy && !foto) procState('pick'); }
function cancelarFoto() { foto = null; procState('pick'); }
async function onFile(inp) {
  const file = inp.files[0]; inp.value = '';
  if (!file || S.busy) return;
  S.busy = true; procState('wait');
  try {
    const img = await loadImg(file);
    const big = toCanvas(img, 0, 0, img.naturalWidth, img.naturalHeight, 2400);
    const dataUrl = toCanvas(big, 0, 0, big.width, big.height, 2048).toDataURL('image/jpeg', .9);
    $('#procImg').src = dataUrl;
    await sleep(50);
    let qr = null; try { qr = leerQR(big); } catch (e) {}
    foto = { dataUrl, partes: recortes(big), qr };
  } catch (e) {
    S.busy = false; foto = null; procState('pick'); return toast('No se pudo leer la foto. Intenta con otra.');
  }
  S.busy = false;
  procesar();
}
async function procesar() {
  if (!foto || S.busy) return;
  S.busy = true; procState('wait');
  try {
    if (!S.cfg) await boot();
    const r = await api('procesarFactura', [foto.dataUrl.split(',')[1], 'image/jpeg', foto.partes], { timeout: 90000, tries: 1 });
    const qr = foto.qr, d = { ...r.datos, ...(qr || {}) };
    if (qr && qr.total != null && qr.igv != null && Math.abs((+d.subtotal || 0) + qr.igv - qr.total) > .05)
      d.subtotal = r2(qr.total - qr.igv);
    cacheImg(r.imagenId, foto.dataUrl);
    const src = foto.dataUrl; foto = null;
    S.isNew = true;
    openSheet({ moneda: 'PEN', estado: 'Pendiente', ...d, id: r.id, imagenId: r.imagenId, _qr: !!qr }, src);
    if (r.aviso && !qr) toast('No se pudo leer automáticamente. Completa los datos.');
  } catch (e) {
    procState('err', (e.message || 'Error') + '. Tu foto se conserva: pulsa Reintentar.');
  } finally { S.busy = false; }
}

/* ---- Validación contable ---- */
function rucOk(r) {
  if (!/^(10|15|16|17|20)\d{9}$/.test(r)) return false;
  const s = [5, 4, 3, 2, 7, 6, 5, 4, 3, 2].reduce((a, w, i) => a + w * +r[i], 0);
  return (11 - s % 11) % 10 === +r[10];
}
function validar() {
  if (!S.cur) return [];
  const v = {}; for (const el of $('#frm').elements) v[el.name] = el.value.trim();
  const n = k => numv(v[k]), W = [], bad = new Set();
  const add = (msg, ...ks) => { W.push(msg); ks.forEach(k => bad.add(k)); };
  const falta = ['fechaEmision', 'ruc', 'proveedor', 'numero', 'total'].filter(k => k === 'total' ? !n(k) : !v[k]);
  if (falta.length) add('Faltan datos obligatorios', ...falta);
  if (v.ruc && !rucOk(v.ruc)) add('El RUC no es válido (revisa los 11 dígitos)', 'ruc');
  if (v.tipo !== 'Recibo por honorarios' && n('total') && (n('subtotal') || n('igv')) && Math.abs(n('subtotal') + n('igv') - n('total')) > .05)
    add(`Subtotal + IGV = ${(n('subtotal') + n('igv')).toFixed(2)}, pero el total es ${n('total').toFixed(2)}`, 'subtotal', 'igv', 'total');
  if (n('subtotal') && n('igv')) {
    const t = n('igv') / n('subtotal');
    if (![.18, .10, .14].some(x => Math.abs(t - x) < .006)) add(`El IGV es el ${(t * 100).toFixed(1)}% del subtotal (lo normal es 18%)`, 'igv');
  }
  if (v.fechaEmision) {
    const d = new Date(v.fechaEmision + 'T12:00'), hoy = new Date();
    if (d > hoy) add('La fecha de emisión está en el futuro', 'fechaEmision');
    else if ((hoy - d) / 864e5 > 366) add('La fecha de emisión tiene más de un año', 'fechaEmision');
  }
  if (v.tipo === 'Factura' && v.serie && !/^[FE]/i.test(v.serie)) add('La serie de una factura empieza con F o E', 'serie');
  if (v.tipo === 'Boleta' && v.serie && !/^[BE]/i.test(v.serie)) add('La serie de una boleta empieza con B o E', 'serie');
  for (const el of $('#frm').elements) el.closest('.row').classList.toggle('bad', bad.has(el.name));
  $('#chk').innerHTML = (S.cur._err ? `<div class="warn"><b>No se pudo guardar</b>${esc(S.cur._err)}</div>` : '')
    + (S.cur._qr ? '<div class="ok">✓ Verificado con el QR SUNAT: RUC, serie, número, fecha, IGV y total</div>' : '')
    + (W.length ? `<div class="warn"><b>Revisa antes de guardar</b>${W.map(w => `<div>• ${esc(w)}</div>`).join('')}</div>`
      : (S.cur._qr ? '' : '<div class="ok">✓ Los importes cuadran</div>'));
  return W;
}

/* ---- Hoja de detalle ---- */
function buildForm() {
  $('#frm').innerHTML = GROUPS.map(([g, fs]) => `<p class="gh">${g}</p><div class="group">${fs.map(([k, l, t]) =>
    `<label class="row"><span>${l}</span>${S.cfg[t] ? `<select name="${k}">${opts(S.cfg[t])}</select>`
      : `<input name="${k}" ${ATTR[t]}>`}</label>`).join('')}</div>`).join('');
}
// Tasa de IGV de la factura (18% por defecto; 0 si es exonerada o recibo por honorarios)
function tasaDe(r) {
  const s = numv(r.subtotal), i = numv(r.igv);
  if (r.tipo === 'Recibo por honorarios' || (s && !i)) return 0;
  if (s && i) { const k = [.18, .10, .14].find(x => Math.abs(i / s - x) < .006); if (k != null) return k; }
  return .18;
}
// Al editar el Total se recalculan Subtotal e IGV
function onEdit(e) {
  if (!S.cur) return;
  const f = $('#frm').elements;
  if (e && e.target.name === 'total') {
    const t = numv(f.total.value), r = S.cur._tasa ?? .18, sub = r2(t / (1 + r));
    f.subtotal.value = t ? sub.toFixed(2) : '';
    f.igv.value = t ? (t - sub).toFixed(2) : '';
  }
  if (e && e.target.name === 'tipo') S.cur._tasa = f.tipo.value === 'Recibo por honorarios' ? 0 : (S.cur._tasa || .18);
  guardarBorrador();
  validar();
}
function openSheet(rec, src) {
  if (!S.cfg) return toast('Cargando configuración, intenta en un momento');
  S.cur = rec;
  rec._tasa = tasaDe(rec);
  for (const el of $('#frm').elements) el.value = rec[el.name] ?? '';
  $('#shTitle').textContent = S.isNew ? 'Revisar datos' : 'Detalle';
  $('#shCancel').textContent = S.isNew ? 'Descartar' : 'Cerrar';
  const img = $('#shImg'); img.removeAttribute('src'); $('.imgbox').classList.remove('zoom');
  const id = rec.imagenId;
  if (src) img.src = src;
  else if (id && IMG.has(id)) img.src = IMG.get(id);
  else if (id) {
    $('#imgSpin').hidden = false;
    api('obtenerImagen', [id], { timeout: 30000, tries: 2 })
      .then(s => { cacheImg(id, s); if (S.cur === rec) img.src = s; })
      .catch(() => { if (S.cur === rec) toast('No se pudo cargar la imagen'); })
      .finally(() => $('#imgSpin').hidden = true);
  }
  if (S.isNew) guardarBorrador(true);
  validar();
  $('#ov').classList.add('open'); $('#sh').classList.add('open'); $('#sh').scrollTop = 0;
}
function closeSheet() { $('#ov').classList.remove('open'); $('#sh').classList.remove('open'); }
function cancelSheet() {
  if (S.isNew && S.cur) {
    if (!confirm('¿Descartar esta factura?')) return;
    api('descartarImagen', [S.cur.imagenId], { tries: 2 }).catch(() => {});
    S.isNew = false; cache.set('draft', null); verBorrador();
  }
  S.cur = null; closeSheet(); resetCap();
}
function ver(id) { const r = S.data.find(x => x.id === id); if (r) { S.isNew = false; openSheet(r); } }

/* ---- Borrador: una factura nueva sin guardar nunca se pierde ---- */
let tDraft;
function guardarBorrador(ya) {
  if (!S.isNew || !S.cur) return;
  clearTimeout(tDraft);
  const fn = () => {
    if (!S.isNew || !S.cur) return;
    const d = limpio(S.cur); for (const el of $('#frm').elements) d[el.name] = el.value;
    d._qr = S.cur._qr; cache.set('draft', d);
  };
  ya ? fn() : (tDraft = setTimeout(fn, 300));
}
function verBorrador() { $('#draftTile').hidden = !cache.get('draft'); }
function seguirBorrador() {
  const d = cache.get('draft');
  if (!d) return verBorrador();
  go('cargar'); S.isNew = true; openSheet(d);
}

/* ---- Guardar: instantáneo en el teléfono + envío seguro con reintentos ---- */
const cola = { get: () => cache.get('outbox') || [], set: q => cache.set('outbox', q) };
const recientes = new Map();
let enviando = false, tFlush;
function upsert(r) { const i = S.data.findIndex(x => x.id === r.id); i < 0 ? S.data.push(r) : (S.data[i] = r); }
function save() {
  if (!S.cur) return;
  const rec = { ...S.cur };
  for (const el of $('#frm').elements) rec[el.name] = el.value.trim();
  ['subtotal', 'igv', 'total'].forEach(k => rec[k] = r2(numv(rec[k])));
  if (!rec.fechaEmision || !rec.total) return toast('Completa fecha de emisión y total');
  if (rec.ruc && rec.numero && S.data.some(r => r.id !== rec.id && nz(r.ruc) === nz(rec.ruc) && nz(r.serie) === nz(rec.serie) && nz(r.numero) === nz(rec.numero)))
    return toast('Esta factura ya está registrada');
  const W = validar();
  if (W.length && !confirm('Hay observaciones:\n\n• ' + W.join('\n• ') + '\n\n¿Guardar de todas formas?')) return;
  const out = limpio(rec), nueva = S.isNew;
  upsert({ ...out, _pend: true }); cache.set('data', S.data);
  cola.set([...cola.get(), { k: Date.now() + '-' + Math.random(), rec: out }]);
  if (nueva) cache.set('draft', null);
  S.isNew = false; S.cur = null;
  closeSheet(); resetCap(); render();
  toast(navigator.onLine === false ? 'Guardada en el teléfono: se enviará al volver la conexión' : (nueva ? 'Factura guardada ✓' : 'Cambios guardados ✓'));
  flush();
}
async function flush() {
  if (enviando || !API_URL) return;
  enviando = true; clearTimeout(tFlush);
  try {
    for (let q = cola.get(); q.length; q = cola.get()) {
      const it = q[0];
      try {
        const saved = await api('guardarFactura', [it.rec], { tries: 2 });
        cola.set(cola.get().filter(x => x.k !== it.k));
        recientes.set(saved.id, { r: saved, t: Date.now() });
        if (!cola.get().some(x => x.rec.id === saved.id)) upsert(saved);
      } catch (e) {
        if (e instanceof NetErr) break;
        cola.set(cola.get().filter(x => x.k !== it.k));
        const r = S.data.find(x => x.id === it.rec.id);
        if (r) { r._pend = false; r._err = e.message; }
        toast(`No se guardó «${it.rec.proveedor || 'factura'}»: ${e.message}`, 6000);
      }
      cache.set('data', S.data); render();
    }
  } finally { enviando = false; }
  if (cola.get().length) tFlush = setTimeout(flush, 15000);
}

/* ---- Contabilidad: muestra al instante lo guardado y actualiza en segundo plano ---- */
let trayendo = null;
function traer() {
  const t0 = Date.now();
  return trayendo ||= api('inicio').then(({ cfg, data }) => {
    aplicarCfg(cfg);
    recientes.forEach((v, id) => { if (v.t >= t0 - 5000) { const i = data.findIndex(x => x.id === id); i < 0 ? data.push(v.r) : (data[i] = v.r); } });
    cola.get().forEach(it => { const i = data.findIndex(x => x.id === it.rec.id), r = { ...it.rec, _pend: true }; i < 0 ? data.push(r) : (data[i] = r); });
    S.data = data; S.loaded = true; S.fresh = Date.now(); cache.set('data', data); render();
  }).finally(() => trayendo = null);
}
async function load(force) {
  if (S.loaded && S.cfg) render(); else $('#list').innerHTML = '<div class="spin" style="margin-top:40px"></div>';
  flush();
  if (!force && Date.now() - S.fresh < 60000) return;
  try { await traer(); if (force) toast('Actualizado ✓'); }
  catch (e) {
    if (S.loaded && S.cfg) toast('Sin conexión: mostrando datos guardados');
    else $('#list').innerHTML = `<div class="empty">${esc(e.message)}<button class="btn sec" onclick="load(true)">Reintentar</button></div>`;
  }
}
function setPer(p) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  const R = { all: ['', ''], mes: [iso(new Date(y, m, 1)), iso(new Date(y, m + 1, 0))],
    ant: [iso(new Date(y, m - 1, 1)), iso(new Date(y, m, 0))], anio: [y + '-01-01', y + '-12-31'] }[p];
  [S.f.desde, S.f.hasta] = R; markPer(p); syncF(); render();
}
function markPer(p) { document.querySelectorAll('#per button').forEach(b => b.classList.toggle('on', b.dataset.p === p)); }
function syncF() { document.querySelectorAll('[data-f]').forEach(el => el.value = S.f[el.dataset.f]); }
function clearF() { Object.keys(S.f).forEach(k => S.f[k] = ''); S.q = ''; $('#q').value = ''; markPer('all'); syncF(); render(); }
function render() {
  if (!S.cfg) return;
  const f = S.f, q = S.q.trim().toLowerCase();
  const rows = S.data.filter(r =>
    (!f.desde || r.fechaEmision >= f.desde) && (!f.hasta || r.fechaEmision <= f.hasta) &&
    ['categoria', 'tipo', 'moneda', 'estado'].every(k => !f[k] || r[k] === f[k]) &&
    (!q || [r.proveedor, r.ruc, r.serie, r.numero, r.descripcion, r.categoria].join(' ').toLowerCase().includes(q))
  ).sort((a, b) => String(b.fechaEmision || '').localeCompare(String(a.fechaEmision || '')));

  const sum = (mon, k, list = rows) => r2(list.filter(r => (r.moneda || 'PEN') === mon).reduce((s, r) => s + (+r[k] || 0), 0));
  $('#stats').innerHTML = `
    <div class="st"><small>Comprobantes</small><b>${rows.length}</b></div>
    <div class="st"><small>Total soles</small><b>${money(sum('PEN', 'total'))}</b></div>
    <div class="st"><small>IGV soles</small><b>${money(sum('PEN', 'igv'))}</b></div>
    <div class="st"><small>Total dólares</small><b>${money(sum('USD', 'total'), 'USD')}</b></div>`;
  $('#fcount').textContent = Object.values(f).filter(Boolean).length || '';

  if (!rows.length) { $('#list').innerHTML = `<div class="empty">${S.data.length ? 'Sin resultados para estos filtros' : 'Aún no hay facturas cargadas'}</div>`; return; }
  const byMonth = {};
  rows.forEach(r => (byMonth[String(r.fechaEmision || '').slice(0, 7)] ||= []).push(r));
  $('#list').innerHTML = Object.entries(byMonth).map(([mk, list]) => {
    const title = /^\d{4}-\d{2}$/.test(mk) ? new Date(mk + '-01T12:00').toLocaleDateString('es-PE', { month: 'long', year: 'numeric' }) : 'Sin fecha';
    return `<p class="gh"><span>${title}</span><span>${money(sum('PEN', 'total', list))}</span></p><div class="group">${list.map(item).join('')}</div>`;
  }).join('');
}
function item(r) {
  const i = S.cfg.categorias.indexOf(r.categoria), col = i < 0 ? '#8e8e93' : PAL[i % PAL.length];
  const doc = [r.serie, r.numero].filter(Boolean).join('-');
  const pill = r._err ? '<span class="pill p-err">No guardado</span>'
    : r._pend ? '<span class="pill p-sync">Enviando…</span>'
    : `<span class="pill p-${esc(r.estado)}">${esc(r.estado)}</span>`;
  return `<div class="item" onclick="ver('${esc(r.id)}')">
    <div class="av" style="background:${col}">${esc((r.categoria || '?')[0])}</div>
    <div class="mid"><div class="t">${esc(r.proveedor || 'Sin proveedor')}</div>
      <div class="s">${fdate(r.fechaEmision)} · ${esc(r.categoria || 'Sin categoría')}${doc ? ' · ' + esc(doc) : ''}</div></div>
    <div class="end"><div class="amt">${money(r.total, r.moneda)}</div>${pill}</div>
    <button class="lupa" aria-label="Ver">${LUPA}</button></div>`;
}

/* ---- Configuración (guardada en el teléfono para abrir al instante) ---- */
function aplicarCfg(c) {
  if (!c || !Array.isArray(c.categorias) || JSON.stringify(c) === JSON.stringify(S.cfg)) return;
  S.cfg = c; cache.set('cfg', c);
  document.querySelectorAll('[data-o]').forEach(el => { const v = el.value; el.innerHTML = opts(c[el.dataset.o]); el.value = v; });
  if (!$('#sh').classList.contains('open')) buildForm();
  if (c.url) { $('#sheetLink').href = c.url; $('#sheetLink').hidden = false; }
  render();
}
async function boot() { aplicarCfg(await api('getConfig')); }

/* ---- Inicio ---- */
(function init() {
  addEventListener('error', e => { console.error(e.error || e.message); toast('Algo falló. Vuelve a intentarlo.'); });
  addEventListener('unhandledrejection', e => console.error(e.reason));
  $('#hoy').textContent = new Date().toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
  document.querySelectorAll('#per button').forEach(b => b.onclick = () => setPer(b.dataset.p));
  document.querySelectorAll('[data-f]').forEach(el => el.onchange = () => {
    S.f[el.dataset.f] = el.value; if (el.type === 'date') markPer(''); render();
  });
  let tq; $('#q').oninput = e => { clearTimeout(tq); tq = setTimeout(() => { S.q = e.target.value; render(); }, 120); };
  const d = cache.get('data'); if (Array.isArray(d)) { S.data = d; S.loaded = true; }
  aplicarCfg(cache.get('cfg'));
  verBorrador();
  // Sincroniza en segundo plano: configuración + facturas en una sola llamada, y envía lo pendiente
  traer().catch(e => { if (!S.cfg) toast(e.message); });
  flush();
  addEventListener('online', flush);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    flush(); if (Date.now() - S.fresh > 60000) traer().catch(() => {});
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  // Ícono para iPhone (iOS no acepta SVG): se genera después de mostrar la app
  setTimeout(() => {
    const ic = new Image();
    ic.onload = () => { try { const c = document.createElement('canvas'); c.width = c.height = 180;
      c.getContext('2d').drawImage(ic, 0, 0, 180, 180);
      const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l); } catch (e) {} };
    ic.src = 'icon.svg';
  }, 1500);
})();
</script>
